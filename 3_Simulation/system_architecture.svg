<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="100%" height="100%" style="background:#0b0f19;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect x="15" y="15" width="950" height="550" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="45" y="55" fill="#38bdf8" font-size="20" font-weight="700">⚡ Delivery Pilot — 7-Stage Architectural Data Flow</text>
  <text x="45" y="80" fill="#94a3b8" font-size="12">Stage 3 Simulation · End-to-End Visual Blueprint &amp; Agent Handoff Pipeline</text>

  <!-- Row 1: Stages 1, 2, 3 -->
  <!-- Stage 1 -->
  <rect x="45" y="110" width="260" height="110" rx="10" fill="#2e1065" stroke="#8b5cf6" stroke-width="2"/>
  <text x="65" y="140" fill="#a78bfa" font-size="14" font-weight="700">1_Real_Unknown</text>
  <text x="65" y="165" fill="#ddd6fe" font-size="12">Coordinator Entrypoint</text>
  <text x="65" y="188" fill="#c4b5fd" font-size="11">Why (Problem, OKRs) · What (Tasks)</text>

  <!-- Flow 1 -> 2 -->
  <line x1="305" y1="165" x2="355" y2="165" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="355,160 365,165 355,170" fill="#8b5cf6"/>

  <!-- Stage 2 -->
  <rect x="365" y="110" width="260" height="110" rx="10" fill="#164e63" stroke="#06b6d4" stroke-width="2"/>
  <text x="385" y="140" fill="#22d3ee" font-size="14" font-weight="700">2_Environment</text>
  <text x="385" y="165" fill="#a5f3fc" font-size="12">Tools &amp; Blueprints</text>
  <text x="385" y="188" fill="#67e8f9" font-size="11">When (Architecture) · Where (Cloud/Local)</text>

  <!-- Flow 2 -> 3 -->
  <line x1="625" y1="165" x2="675" y2="165" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="675,160 685,165 675,170" fill="#06b6d4"/>

  <!-- Stage 3 (Highlighted) -->
  <rect x="685" y="110" width="250" height="110" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
  <text x="705" y="140" fill="#34d399" font-size="14" font-weight="700">3_Simulation ★</text>
  <text x="705" y="165" fill="#a7f3d0" font-size="12">Visual Contracts &amp; Excalidraw</text>
  <text x="705" y="188" fill="#6ee7b7" font-size="11">Carousels, Wireframes, Workflows</text>

  <!-- Flow 3 -> 4 (Vertical) -->
  <line x1="810" y1="220" x2="810" y2="265" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="805,265 810,275 815,265" fill="#10b981"/>

  <!-- Row 2: Stages 7/6, 5, 4 -->
  <!-- Stage 4 -->
  <rect x="685" y="275" width="250" height="110" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
  <text x="705" y="305" fill="#fbbf24" font-size="14" font-weight="700">4_Formula</text>
  <text x="705" y="330" fill="#fde68a" font-size="12">Governance &amp; Specs</text>
  <text x="705" y="353" fill="#fcd34d" font-size="11">SPEC-001..SPEC-026 · Approval Gate</text>

  <!-- Flow 4 -> 5 -->
  <line x1="685" y1="330" x2="635" y2="330" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="635,325 625,330 635,335" fill="#f59e0b"/>

  <!-- Stage 5 -->
  <rect x="365" y="275" width="260" height="110" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="385" y="305" fill="#f87171" font-size="14" font-weight="700">5_Symbols</text>
  <text x="385" y="330" fill="#fecaca" font-size="12">Implementation Code</text>
  <text x="385" y="353" fill="#fca5a5" font-size="11">Toolbox, Scripts, Rules, HTML Viewers</text>

  <!-- Flow 5 -> 7/6 -->
  <line x1="365" y1="330" x2="315" y2="330" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="315,325 305,330 315,335" fill="#ef4444"/>

  <!-- Stage 7 & 6 -->
  <rect x="45" y="275" width="260" height="110" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="65" y="305" fill="#60a5fa" font-size="14" font-weight="700">7_Testing &amp; 6_Semblance</text>
  <text x="65" y="330" fill="#bfdbfe" font-size="12">Verification &amp; Remediation</text>
  <text x="65" y="353" fill="#93c5fd" font-size="11">Smoke Tests (12/12) · Lessons Learned</text>

  <!-- Central Thinking Log Bus -->
  <rect x="45" y="420" width="890" height="90" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6"/>
  <text x="65" y="455" fill="#c4b5fd" font-size="14" font-weight="700">🔄 Central Thinking &amp; Traceability Bus: 4_Formula/llm_thinking_log.md</text>
  <text x="65" y="480" fill="#e0e7ff" font-size="12">All agents record rationale, state transitions, test results, and cross-stage lineage to prevent context drift.</text>
  <text x="65" y="500" fill="#a5b4fc" font-size="11">Excalidraw Carousel connects Stage 3 visual wireframes to Stage 1 requirements and Stage 4 specs.</text>
</svg>
